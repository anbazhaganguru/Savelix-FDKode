<!DOCTYPE html>
<html>
<head>
  <title>Reference Inspector</title>
  <style>
    body { margin: 0; background: #222; color: #fff; font-family: monospace; }
    #container { position: relative; display: inline-block; }
    #canvas { cursor: crosshair; }
    #info { position: fixed; top: 10px; right: 10px; background: rgba(0,0,0,0.85); padding: 12px; border-radius: 8px; font-size: 14px; max-width: 400px; }
  </style>
</head>
<body>
  <div id="container">
    <canvas id="canvas" width="1024" height="576"></canvas>
  </div>
  <div id="info">
    <div><strong>Coordinates:</strong> <span id="coords">0, 0</span></div>
    <div><strong>Color:</strong> <span id="color">rgba(...)</span> <span id="swatch" style="display:inline-block;width:16px;height:16px;vertical-align:middle;border:1px solid #fff"></span></div>
    <div><strong>Selection:</strong> <span id="sel">None</span></div>
    <div id="details" style="margin-top:8px; white-space: pre-wrap; font-size:12px;"></div>
  </div>
  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const img = new Image();
    img.src = '/assets/hero/hero-reference-full.jpg';
    img.onload = () => {
      ctx.drawImage(img, 0, 0);
      measureKeyElements();
    };

    let startX, startY, isDown = false;
    canvas.addEventListener('mousemove', e => {
      const rect = canvas.getBoundingClientRect();
      const x = Math.round(e.clientX - rect.left);
      const y = Math.round(e.clientY - rect.top);
      document.getElementById('coords').textContent = `${x}, ${y}`;
      const p = ctx.getImageData(x, y, 1, 1).data;
      const hex = '#' + [p[0], p[1], p[2]].map(c => c.toString(16).padStart(2, '0')).join('');
      document.getElementById('color').textContent = `RGB(${p[0]},${p[1]},${p[2]}) ${hex}`;
      document.getElementById('swatch').style.background = hex;

      if (isDown) {
        document.getElementById('sel').textContent = `x:${Math.min(startX, x)}, y:${Math.min(startY, y)}, w:${Math.abs(x - startX)}, h:${Math.abs(y - startY)}`;
      }
    });

    canvas.addEventListener('mousedown', e => {
      const rect = canvas.getBoundingClientRect();
      startX = Math.round(e.clientX - rect.left);
      startY = Math.round(e.clientY - rect.top);
      isDown = true;
    });

    canvas.addEventListener('mouseup', () => { isDown = false; });

    function measureKeyElements() {
      // Let's sample key points:
      const points = {
        'Navbar Bg': [100, 26],
        'Logo Area': [70, 26],
        'Nav Link Home': [245, 26],
        'Nav Active Line': [245, 36],
        'Nav Link About': [290, 26],
        'Nav CTA Button': [880, 26],
        'Hero Bg Left': [100, 150],
        'Eyebrow Text': [100, 134],
        'Heading Comprehensive': [150, 175],
        'Heading Healthcare': [150, 215],
        'Heading for Better Living': [150, 260],
        'Body Copy': [150, 310],
        'Primary CTA Button': [140, 395],
        'Secondary CTA Button': [290, 395],
        'Explore Services Link': [100, 436],
        'Bottom Trust 1': [100, 490],
        'Bottom Trust 2': [230, 490],
        'Bottom Trust 3': [370, 490],
        'Center Card Room': [640, 300],
        'Card 1 Sprout': [475, 180],
        'Card 2 Zen': [475, 365],
        'Card 3 Mountain': [820, 220],
        'Card 4 Hands': [860, 395],
        'Right Text 01': [930, 100],
      };
      let report = '';
      for (const [name, [x, y]] of Object.entries(points)) {
        const p = ctx.getImageData(x, y, 1, 1).data;
        const hex = '#' + [p[0], p[1], p[2]].map(c => c.toString(16).padStart(2, '0')).join('');
        report += `${name} (${x},${y}): ${hex}\n`;
      }
      document.getElementById('details').textContent = report;
      console.log(report);
    }
  </script>
</body>
</html>
