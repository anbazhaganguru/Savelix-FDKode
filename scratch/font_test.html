<!DOCTYPE html>
<html>
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800;900&family=Plus+Jakarta+Sans:wght@700;800&family=Syne:wght@700;800&family=Montserrat:wght@700;800;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
  <style>
    body { background: #1a162b; color: white; padding: 40px; font-family: sans-serif; }
    .row { margin-bottom: 24px; display: flex; align-items: center; gap: 20px; }
    .label { width: 180px; font-size: 14px; color: #a59fb6; }
    .lockup {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 8px 16px;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 9999px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    }
    .lockup-dark {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 8px 16px;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 9999px;
    }
    .sym { width: 36px; height: 36px; object-fit: contain; }
    .wordmark {
      font-size: 24px;
      line-height: 1;
      background: linear-gradient(90deg, #462A86 0%, #38318E 20%, #205FA8 40%, #157CBC 58%, #11939E 74%, #28A756 88%, #5DB832 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .f-outfit { font-family: 'Outfit', sans-serif; font-weight: 800; letter-spacing: 0.08em; }
    .f-syne { font-family: 'Syne', sans-serif; font-weight: 800; letter-spacing: 0.06em; }
    .f-montserrat { font-family: 'Montserrat', sans-serif; font-weight: 800; letter-spacing: 0.08em; }
    .f-pjs { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; letter-spacing: 0.08em; }
    .f-space { font-family: 'Space Grotesk', sans-serif; font-weight: 700; letter-spacing: 0.06em; }
  </style>
</head>
<body>
  <h2>Wordmark Font Candidates on Light Backing</h2>
  <div class="row">
    <div class="label">Outfit 800:</div>
    <div class="lockup">
      <img src="http://localhost:5173/assets/savelix-symbol.png" class="sym">
      <span class="wordmark f-outfit">SAVELIX</span>
    </div>
  </div>
  <div class="row">
    <div class="label">Syne 800:</div>
    <div class="lockup">
      <img src="http://localhost:5173/assets/savelix-symbol.png" class="sym">
      <span class="wordmark f-syne">SAVELIX</span>
    </div>
  </div>
  <div class="row">
    <div class="label">Plus Jakarta Sans 800:</div>
    <div class="lockup">
      <img src="http://localhost:5173/assets/savelix-symbol.png" class="sym">
      <span class="wordmark f-pjs">SAVELIX</span>
    </div>
  </div>
  <div class="row">
    <div class="label">Montserrat 800:</div>
    <div class="lockup">
      <img src="http://localhost:5173/assets/savelix-symbol.png" class="sym">
      <span class="wordmark f-montserrat">SAVELIX</span>
    </div>
  </div>
  <div class="row">
    <div class="label">Space Grotesk 700:</div>
    <div class="lockup">
      <img src="http://localhost:5173/assets/savelix-symbol.png" class="sym">
      <span class="wordmark f-space">SAVELIX</span>
    </div>
  </div>

  <h2>Transparent / Subtle Frosted Pod</h2>
  <div class="row">
    <div class="label">Outfit 800 on Pod:</div>
    <div class="lockup-dark">
      <img src="http://localhost:5173/assets/savelix-symbol.png" class="sym">
      <span class="wordmark f-outfit">SAVELIX</span>
    </div>
  </div>
</body>
</html>
